<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1220" />
    <!-- Theme + language before first paint (English + dark unless the person chose otherwise). -->
    <script>
      (function () {
        try {
          var d = document.documentElement;
          if (localStorage.getItem('radiology:lang') === 'ar') {
            d.lang = 'ar';
            d.dir = 'rtl';
          }
          if (localStorage.getItem('radiology:theme') === 'light') {
            d.setAttribute('data-theme', 'light');
            document.querySelector('meta[name="theme-color"]').content = '#E9EEF4';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Radiology" />
    <meta
      name="description"
      content="Structured radiology report generators for CT, MRI, ultrasound, X-ray and fluoroscopy — edited by Dr. Yasser Shalaby, MD."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Radiology Reporting Suite — Dr. Yasser Shalaby, MD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
