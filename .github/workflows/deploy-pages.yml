name: Deploy to GitHub Pages

# Builds the app and publishes dist/ to GitHub Pages on every push to main.
# One-time setup: repo → Settings → Pages → Build and deployment → Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (pnpm@9.15.0) — passing a
      # `version:` here as well makes the action fail with "Multiple versions of pnpm".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # VITE_* come from the committed .env.production (public URL + publishable key — RLS is
      # the security boundary). A relative base works under https://<owner>.github.io/<repo>/.
      - run: pnpm build
        env:
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || './' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # While the repo's Pages source is still "Deploy from a branch", every push also starts
      # GitHub's own `pages-build-deployment`, which publishes the raw sources (a blank page).
      # Whichever finishes last wins — so wait for it, then publish dist/ on top. The API names
      # that run "pages build and deployment" (path dynamic/pages/pages-build-deployment).
      - name: Wait for the branch-based Pages build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            pending=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&per_page=50" \
              --jq '[.workflow_runs[] | select((.path // "" | contains("pages-build-deployment")) or .name == "pages build and deployment") | select(.status != "completed")] | length')
            [ "$pending" = "0" ] && exit 0
            echo "Branch-based Pages build still running; waiting ($i)…"
            sleep 10
          done
          echo "Gave up waiting; deploying anyway."
      - id: deploy
        uses: actions/deploy-pages@v4
